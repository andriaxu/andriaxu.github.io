<style>
  :root{
    --paper:#F6F4EA;
    --paper-deep:#EDEADD;
    --ink:#20302A;
    --ink-soft:#4E5F57;
    --sky:#B7DEE6;
    --sky-deep:#5E9FB0;
    --sage:#C8DBBB;
    --sage-deep:#7C9E68;
    --line: rgba(32,48,42,.14);
    --radius: 14px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}
  a{color:inherit; text-decoration:none;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--sage-deep);
  }

  /* background atmosphere */
  .atmosphere{
    position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
  }
  .atmosphere .blob{
    position:absolute; border-radius:50%; filter:blur(70px); opacity:.55;
  }
  .atmosphere .blob.b1{ width:520px; height:520px; background:var(--sky); top:-160px; left:-120px; }
  .atmosphere .blob.b2{ width:460px; height:460px; background:var(--sage); bottom:-180px; right:-140px; }

  /* hero */
  .hero{
    min-height:88vh;
    display:flex; flex-direction:column; justify-content:center;
    padding-top:40px; padding-bottom:40px;
    position:relative;
  }
  .hero-eyebrow{ margin-bottom:22px; }
  .hero-name{
    position:relative;
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(3.2rem, 9vw, 7rem);
    line-height:.98;
    letter-spacing:-.01em;
  }
  .hero-name .layer{
    display:block;
  }
  .hero-name .layer-low{
    color:var(--sage-deep);
    filter:blur(13px);
    opacity:.9;
    position:absolute; inset:0;
    transition:filter .12s linear, opacity .12s linear;
  }
  .hero-name .layer-high{
    color:var(--ink);
    position:relative;
    filter:blur(0px);
    opacity:.18;
    transition:opacity .12s linear;
  }
  /* section shell */
  .section{ padding:96px 0; border-top:1px solid var(--line); }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:52px; gap:24px; flex-wrap:wrap;
  }
  .section-title{
    font-family:'Fraunces', serif; font-weight:500;
    font-size:clamp(1.9rem, 3.4vw, 2.6rem);
  }
  .section-title em{ font-style:italic; color:var(--sky-deep); }
  .section-desc{
    max-width:340px; font-size:.92rem; color:var(--ink-soft); line-height:1.55;
  }

  /* work grid */
  .work-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:28px;
  }
  .proj-card{
    display:block;
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    opacity:0; transform:translateY(18px);
    transition:opacity .6s ease, transform .6s ease, box-shadow .25s ease, border-color .25s ease;
    cursor:pointer;
  }
  .proj-card.in{ opacity:1; transform:translateY(0); }
  .proj-card:hover{
    border-color:var(--sage-deep);
    box-shadow:0 14px 32px rgba(32,48,42,.12);
  }
  .proj-card:hover .proj-body h3{ color:var(--sky-deep); }
  .proj-frame{
    position:relative; aspect-ratio:4/3; overflow:hidden;
  }
  .proj-num{
    position:absolute; top:14px; left:14px; z-index:2;
    font-family:'IBM Plex Mono', monospace; font-size:.72rem;
    color:var(--paper); background:rgba(32,48,42,.55);
    padding:3px 8px; border-radius:20px; letter-spacing:.04em;
  }
  .proj-placeholder{
    position:absolute; top:14px; right:14px; z-index:2;
    font-family:'IBM Plex Mono', monospace; font-size:.6rem;
    letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); background:rgba(246,244,234,.75);
    border:1px dashed var(--ink-soft); border-radius:20px;
    padding:3px 8px; opacity:.7;
  }
  .proj-image{ position:absolute; inset:0; }
  .proj-body{ padding:22px 22px 26px; }
  .proj-meta{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem;
    letter-spacing:.08em; text-transform:uppercase;
    color:var(--sage-deep); margin-bottom:10px;
  }
  .proj-body h3{
    font-family:'Fraunces', serif; font-weight:500; font-size:1.28rem;
    margin-bottom:10px; line-height:1.25;
  }
  .proj-body p{ font-size:.9rem; color:var(--ink-soft); line-height:1.55; margin-bottom:16px; }
  .proj-tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .proj-tags span{
    font-family:'IBM Plex Mono', monospace; font-size:.66rem;
    padding:4px 9px; border-radius:20px;
    background:rgba(183,222,230,.4); color:var(--ink);
    border:1px solid var(--line);
  }

  @media (max-width:760px){
    .work-grid{ grid-template-columns:1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    .layer-low{ display:none; }
    .layer-high{ opacity:1 !important; }
    .scroll-cue span.line{ animation:none; }
    .proj-card{ transition:none; opacity:1; transform:none; }
  }
</style>

<script>
  // hybrid-image hero: cursor proximity controls the blur/opacity blend
  (function(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var hero = document.getElementById('heroName');
    var low = hero.querySelector('.layer-low');
    var high = hero.querySelector('.layer-high');
    if(reduce) return;

    var hasFinePointer = window.matchMedia('(hover:hover) and (pointer:fine)').matches;

    function applyBlend(t){ // t: 0 (far/blurry) .. 1 (close/sharp)
      t = Math.max(0, Math.min(1, t));
      low.style.opacity = (0.92 - t*0.72).toFixed(2);
      low.style.filter = 'blur(' + (6 + (1-t)*14).toFixed(1) + 'px)';
      high.style.opacity = (0.12 + t*0.88).toFixed(2);
    }

    if(hasFinePointer){
      document.addEventListener('mousemove', function(e){
        var rect = hero.getBoundingClientRect();
        var cx = rect.left + rect.width/2;
        var cy = rect.top + rect.height/2;
        var dx = e.clientX - cx, dy = e.clientY - cy;
        var dist = Math.sqrt(dx*dx + dy*dy);
        var maxDist = Math.max(window.innerWidth, window.innerHeight) * 0.55;
        var t = 1 - Math.min(dist / maxDist, 1);
        applyBlend(t);
      });
      applyBlend(0.15);
    } else {
      // ambient auto-oscillation for touch devices
      var start = null;
      function frame(ts){
        if(!start) start = ts;
        var elapsed = (ts - start) / 1000;
        var t = (Math.sin(elapsed * 0.6) + 1) / 2;
        applyBlend(t);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
  })();

  // reveal project cards on scroll
  (function(){
    var cards = document.querySelectorAll('.proj-card');
    if(!('IntersectionObserver' in window)){
      cards.forEach(function(c){ c.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    cards.forEach(function(c){ io.observe(c); });
  })();
</script>
